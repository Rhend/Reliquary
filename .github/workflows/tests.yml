# CI — lance les tests headless du projet à chaque push / pull request.
#
# Suites :
#   • TestScriptsLoad     — smoke test : tous les scripts compilent avec les autoloads
#   • TestCombatCtb       — moteur de combat tour par tour CTB (Rework Combat)
#   • TestExpeditionFlow  — boucle d'expédition : stats de cycle + résumé
#   • TestTierCap         — garde-fou plafond dur global (T2) : XP / évolution / Hall / Village
#   • TestDropSystem      — drops de biome : taux/quantité fréquent + rare, gating Forge
#   • TestHoloXlsx        — lecteur runtime du gabarit Excel (HoloMap) : params, formes, feuilles vides
# Chaque scène de test quitte avec un code ≠ 0 en cas d'échec.

name: tests

on: [push, pull_request]

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=./Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # Premier lancement : import des ressources (.godot/) requis avant les tests.
      - name: Importer les ressources
        run: $GODOT --headless --path . --import || true

      - name: TestScriptsLoad (compilation des scripts)
        run: $GODOT --headless --path . res://tests/TestScriptsLoad.tscn

      - name: TestCombatCtb (moteur tour par tour CTB)
        run: $GODOT --headless --path . res://tests/TestCombatCtb.tscn

      - name: TestCombatUi (écran de combat CTB jouable)
        run: $GODOT --headless --path . res://tests/TestCombatUi.tscn

      - name: TestRecompenses (économie de récompense — XP + Euren)
        run: $GODOT --headless --path . res://tests/TestRecompenses.tscn

      - name: TestExpeNoeuds (nœuds réels — affixes + consommables)
        run: $GODOT --headless --path . res://tests/TestExpeNoeuds.tscn

      - name: TestExpeCarte (carte d'expédition — génération, brouillard, étages)
        run: $GODOT --headless --path . res://tests/TestExpeCarte.tscn

      - name: TestExpeCombat (branchement combat CTB ↔ nœuds d'expédition)
        run: $GODOT --headless --path . res://tests/TestExpeCombat.tscn

      - name: TestExpeditionFlow (boucle d'expédition)
        run: $GODOT --headless --path . res://tests/TestExpeditionFlow.tscn

      - name: TestFluxExpedition (flux de jeu réel — QG → HoloMap → expédition → crédits persistés)
        run: $GODOT --headless --path . res://tests/TestFluxExpedition.tscn

      - name: TestGameOver (sanction de mort — compteur R-XXX, rechargement, suspension)
        run: $GODOT --headless --path . res://tests/TestGameOver.tscn

      - name: TestAlarme (Alarme + assauts de Lieutenants — chantier 11)
        run: $GODOT --headless --path . res://tests/TestAlarme.tscn

      - name: TestEconomieQG (Modules, Sceaux, voies, panneaux — chantiers 12-13)
        run: $GODOT --headless --path . res://tests/TestEconomieQG.tscn

      - name: TestEquipementDepart (équipement de départ Commun — chantier 13)
        run: $GODOT --headless --path . res://tests/TestEquipementDepart.tscn

      - name: TestVillageBuildings (bâtiments — coûts Euren + Modules)
        run: $GODOT --headless --path . res://tests/TestVillageBuildings.tscn

      - name: TestTierCap (plafond dur global T2)
        run: $GODOT --headless --path . res://tests/TestTierCap.tscn

      - name: TestDropSystem (drops de biome)
        run: $GODOT --headless --path . res://tests/TestDropSystem.tscn

      - name: TestHoloXlsx (lecteur gabarit Excel HoloMap)
        run: $GODOT --headless --path . res://tests/TestHoloXlsx.tscn

      - name: TestHoloTraffic (simulation de trafic — pas de croisement)
        run: $GODOT --headless --path . res://tests/TestHoloTraffic.tscn

      - name: TestHoloPicking (picking des zones d'expédition sur la carte holo)
        run: $GODOT --headless --path . res://tests/TestHoloPicking.tscn

      - name: TestButin (butin de matériaux d'expédition — chantier 14)
        run: $GODOT --headless --path . res://tests/TestButin.tscn

      - name: TestMecaniquesBiomes (mécaniques fortes de biome en CTB — chantier 15)
        run: $GODOT --headless --path . res://tests/TestMecaniquesBiomes.tscn

      - name: TestCompetences (compétences du héros en CTB — chantier 16)
        run: $GODOT --headless --path . res://tests/TestCompetences.tscn

      - name: TestLieuxSecondaires (Lieux révélés par les voies — chantier 17)
        run: $GODOT --headless --path . res://tests/TestLieuxSecondaires.tscn

      - name: TestShowRoom (vitrine des assets Spine — registre + aller-retour QG)
        run: $GODOT --headless --path . res://tests/TestShowRoom.tscn

      - name: TestNeonsCite (enseignes néon vivantes — bake à jour + rendu)
        run: $GODOT --headless --path . res://tests/TestNeonsCite.tscn
